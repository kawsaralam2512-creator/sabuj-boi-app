{% extends "base.html" %}

{% block title %}এডিট — বিবিধ{% endblock %}

{% block content %}

<!-- Breadcrumb -->
<nav class="breadcrumb-nav">
    <div class="breadcrumb-container">
        <a href="/" class="breadcrumb-link">🏠 হোম</a>
        <span class="breadcrumb-sep">›</span>
        <a href="/misc" class="breadcrumb-link">📝 বিবিধ</a>
        <span class="breadcrumb-sep">›</span>
        <span class="breadcrumb-current">✏️ এডিট #{{ entry.id }}</span>
    </div>
</nav>

<div class="form-page-container">

    <div class="form-page-header">
        <div class="form-page-icon">✏️</div>
        <h1 class="form-page-title">তথ্য সম্পাদনা করুন</h1>
        <p class="form-page-subtitle">এন্ট্রি #{{ entry.id }} সম্পাদনা করছেন</p>
    </div>

    <div class="form-card">
        <form method="POST">

            <div class="form-group">
                <label for="problem" class="form-label">
                    সমস্যা <span class="required">*</span>
                </label>
                <textarea id="problem" name="problem" class="form-textarea" rows="3" required>{{ entry.problem }}</textarea>
            </div>

            <div class="form-group">
                <label for="solution" class="form-label">
                    সমাধান <span class="required">*</span>
                </label>
                <textarea id="solution" name="solution" class="form-textarea" rows="5" required>{{ entry.solution }}</textarea>
            </div>

            <div class="form-actions">
                <a href="/misc" class="btn btn-secondary">← বাতিল</a>
                <button type="submit" class="btn btn-primary">💾 আপডেট করুন</button>
            </div>

        </form>
    </div>

</div>

{% endblock %}
