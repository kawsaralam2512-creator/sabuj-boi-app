{% extends "base.html" %}

{% block title %}PDF Viewer — সবুজ বই{% endblock %}

{% block content %}
<div class="pdf-viewer-wrapper" style="height: calc(100vh - 80px); display: flex; flex-direction: column; background: #f8f9fa;">
    
    <div class="pdf-controls p-3 bg-white border-bottom d-flex justify-content-between align-items-center shadow-sm">
        <div>
            <h5 class="m-0 text-success fw-bold">📖 {{ pdf_title or 'সবুজ বই - প্রক্রিয়াকরণ নির্দেশিকা' }}</h5>
            <small class="text-muted">পৃষ্ঠা: {{ page }}</small>
        </div>
        <div>
            <a href="{{ back_url or 'javascript:history.back()' }}" class="btn btn-outline-secondary btn-sm">← ফিরে যান</a>
            <a href="{{ pdf_url }}" target="_blank" class="btn btn-outline-success btn-sm ms-2">📥 ডাউনলোড</a>
        </div>
    </div>

    <div class="pdf-container flex-grow-1" style="position: relative;">
        <!-- #page={{ page }} ব্যবহার করে সরাসরি পেজ ওপেন হবে -->
        <iframe 
            src="{{ pdf_url }}#page={{ page }}&view=FitH" 
            width="100%" 
            height="100%" 
            style="border: none;"
            title="PDF Viewer">
        </iframe>
    </div>

</div>
{% endblock %}
