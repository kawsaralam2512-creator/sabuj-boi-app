{% extends "base.html" %}

{% block title %}নতুন এন্ট্রি যোগ — বিবিধ{% endblock %}

{% block content %}

<!-- Breadcrumb -->
<nav class="breadcrumb-nav">
    <div class="breadcrumb-container">
        <a href="/" class="breadcrumb-link">🏠 হোম</a>
        <span class="breadcrumb-sep">›</span>
        <a href="/misc" class="breadcrumb-link">📝 বিবিধ</a>
        <span class="breadcrumb-sep">›</span>
        <span class="breadcrumb-current">➕ নতুন যোগ</span>
    </div>
</nav>

<div class="form-page-container">

    <div class="form-page-header">
        <div class="form-page-icon">➕</div>
        <h1 class="form-page-title">নতুন সমস্যা/সমাধান যোগ করুন</h1>
        <p class="form-page-subtitle">নিচের ফর্মটি পূরণ করে সংরক্ষণ করুন</p>
    </div>

    <div class="form-card">
        <form method="POST" action="/misc/add">

            <div class="form-group">
                <label for="problem" class="form-label">
                    সমস্যা <span class="required">*</span>
                </label>
                <textarea id="problem" name="problem" class="form-textarea" rows="3" required
                          placeholder="যেমন: প্রকল্প প্রস্তাব দেরিতে জমা দেওয়া"></textarea>
            </div>

            <div class="form-group">
                <label for="solution" class="form-label">
                    সমাধান <span class="required">*</span>
                </label>
                <textarea id="solution" name="solution" class="form-textarea" rows="5" required
                          placeholder="যেমন: আগে থেকেই পরিকল্পনা করে সময়মতো ডিপিপি প্রস্তুত করতে হবে..."></textarea>
            </div>

            <div class="form-actions">
                <a href="/misc" class="btn btn-secondary">← বাতিল</a>
                <button type="submit" class="btn btn-primary">💾 সংরক্ষণ করুন</button>
            </div>

        </form>
    </div>

</div>

{% endblock %}
